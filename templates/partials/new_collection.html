{% from 'macros.html' import csrf with context %}
<dialog class="dialog" id="new-collection-dialog"><h2>Новая подборка</h2><form method="post" action="{{ url_for('create_collection') }}" class="stack-form">{{ csrf() }}<div><label for="collection-title">Название</label><input id="collection-title" name="title" minlength="3" maxlength="120" placeholder="Например, Готовлюсь к сессии" required></div><div><label for="collection-description">Описание</label><textarea id="collection-description" name="description" placeholder="Что соберём в этой подборке?" maxlength="1000"></textarea></div><button class="button full">Создать подборку</button><button type="button" class="button secondary full" data-close>Отмена</button></form></dialog>
